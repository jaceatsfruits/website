<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poet</title>
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #ffffff;
      font-family: 'IM Fell English', serif;
      color: #222;
    }
    .definition {
      position: absolute;
      top: 20%;
      left: 25%;
      transform: rotate(-0.3deg);
      font-size: 1.2em;
      white-space: pre-line;
      line-height: 1.8;
    }
    .italic {
      font-style: italic;
    }
    a {
      position: relative;
      display: inline-block;
      color: #000;
      text-decoration: none;
      font-size: 0.9em;
    }

    a:hover::before {
      content: '';
      position: absolute;
      left: -2px;
      right: -2px;
      top: 45%;
      transform: translateY(-50%) rotate(-2deg) skewX(-2deg);
      height: 1.4em;
      background: rgba(150, 250, 140, 0.75);
      z-index: -1;
      border-radius: 6px;
      mix-blend-mode: multiply;
    }

    .pencil-underline::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 8px;
      background-image: url('underline_extracted.png');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center bottom;
      opacity: 0.85;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <a href="index.html" class="pencil-underline">go back</a>
  <p>Education</em></a>.</p>

  </div>
</body>
</html>
