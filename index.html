<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jacqueline Lan</title>
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English&display=swap" rel="stylesheet">
  <style>
    body {
      filter: brightness(0.98);
      font-family: 'IM Fell English', serif;
      background-color: #ffffff;
      color: #000;
      line-height: 1.6;
      padding: 5em 2em;
      max-width: 800px;
      margin: 0 auto;
      transform: rotate(-0.8deg);
      transform-origin: top left;
    }

    a {
      position: relative;
      display: inline-block;
      color: #000;
      text-decoration: none;
      font-size: 0.9em;
    }

    a:hover::before {
      content: '';
      position: absolute;
      left: -2px;
      right: -2px;
      top: 45%;
      transform: translateY(-50%) rotate(-2deg) skewX(-2deg);
      height: 1.4em;
      background: rgba(150, 250, 140, 0.75);
      z-index: -1;
      border-radius: 6px;
      mix-blend-mode: multiply;
    }

    .pencil-underline::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 8px;
      background-image: url('underline_extracted.png');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center bottom;
      opacity: 0.85;
      pointer-events: none;
    }

    .italic {
      font-style: italic;
      text-transform: uppercase;
    }

    footer {
      margin-top: 5em;
      font-size: 0.9em;
    }

    .footnote {
      font-size: 0.8em;
      margin-top: 3em;
    }

    .vignette {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background: radial-gradient(ellipse at center, rgba(0,0,0,0) 50%, rgba(0,0,0,0.08) 100%);
      z-index: 1;
    }
    #curtain {
      position: fixed;
      inset: 0;
      z-index: 100;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      transition: transform 0.9s cubic-bezier(0.77, 0, 0.18, 1), opacity 0.9s ease;
    }

    #curtain img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
    }

    #curtain.open {
      transform: translateY(-100%);
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="curtain" onclick="openCurtain()">
    <img src="curtain.jpg" alt="party curtain">
  </div>
  <script>
    const navEntry = performance.getEntriesByType('navigation')[0];
    const isBackNav = navEntry && (navEntry.type === 'back_forward');
    const isInternalNav = sessionStorage.getItem('curtainSeen') && navEntry && navEntry.type === 'navigate';

    if (isBackNav || isInternalNav) {
      document.getElementById('curtain').style.display = 'none';
    }

    function openCurtain() {
      sessionStorage.setItem('curtainSeen', '1');
      document.getElementById('curtain').classList.add('open');
    }
  </script>
  <h1 style="font-size: 1.4em;">Translator's Foreword</h1>
  <p>
    <a href="jac.html" class="pencil-underline">She</a> <a href="serious.html" class="pencil-underline">sighs</a> along with objects that aspire to resemble <a href="works.html" class="pencil-underline">something</a> else.<sup>1</sup>
  </p>
  <div class="footnote">
    <sup>1</sup> write to her: jacquelinelan1642@gmail.com<br>
    see her: @pistachio.cache
  </div>
  <div class="vignette"></div>
</body>
</html>
