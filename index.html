<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jacqueline Lan</title>
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English&family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet">
  <style>
    html {
      background-color: #fafafa;
    }
    body {
      font-family: 'IM Fell English', serif;
      background-color: transparent;
      color: #000;
      line-height: 1.6;
      margin: 0;
    }
    /* The page aesthetic (slight tint + rotation) lives on a wrapper, not on
       body, so that position:fixed overlays (#curtain, .vignette) are anchored
       to the viewport rather than to a transformed/filtered body box. */
    .page {
      filter: brightness(0.98);
      padding: 5em 2em;
      max-width: 800px;
      margin: 0 auto;
      transform: rotate(-0.8deg);
      transform-origin: top left;
    }

    a {
      position: relative;
      display: inline-block;
      color: #000;
      text-decoration: none;
      font-size: 0.9em;
    }

    a:hover::before {
      content: '';
      position: absolute;
      left: -2px;
      right: -2px;
      top: 45%;
      transform: translateY(-50%) rotate(-2deg) skewX(-2deg);
      height: 1.4em;
      background: rgba(150, 250, 140, 0.75);
      z-index: -1;
      border-radius: 6px;
      mix-blend-mode: multiply;
    }

    .pencil-underline::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 8px;
      background-image: url('underline_extracted.png');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center bottom;
      opacity: 0.85;
      pointer-events: none;
    }

    .italic {
      font-style: italic;
      text-transform: uppercase;
    }

    footer {
      margin-top: 5em;
      font-size: 0.9em;
    }

    .footnote {
      font-size: 0.8em;
      margin-top: 3em;
    }

    .vignette {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background: radial-gradient(ellipse at center, rgba(0,0,0,0) 50%, rgba(0,0,0,0.08) 100%);
      z-index: 1;
    }
    #curtain {
      position: fixed;
      inset: 0;
      z-index: 100;
      cursor: pointer;
      overflow: hidden;
      background: #d81b8c;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      transition: transform 0.9s cubic-bezier(0.77, 0, 0.18, 1), opacity 0.9s ease;
    }

    #curtain-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Fallback still image, shown only if WebGL/three.js is unavailable */
    #curtain-img {
      display: none;
      position: absolute;
      inset: 0;
      margin: auto;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
    }
    #curtain.fallback { display: flex; align-items: center; justify-content: center; }
    #curtain.fallback #curtain-canvas { display: none; }
    #curtain.fallback #curtain-img { display: block; }

    .curtain-hint {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 9%;
      padding: 0 8%;
      text-align: center;
      /* EB Garamond given a worn, photocopied-book finish: warm ink colour,
         a soft ink-bleed shadow, a hair of blur and a sepia cast so it reads
         like a line lifted from a scanned 1970s paperback. */
      font-family: 'EB Garamond', 'IM Fell English', Georgia, serif;
      font-size: 1.5em;
      line-height: 1.35;
      letter-spacing: 0.01em;
      color: #f5ecd6;
      text-shadow:
        0 0 1px rgba(70, 25, 45, 0.55),
        0.4px 0.5px 0.7px rgba(35, 12, 22, 0.45);
      filter: blur(0.35px) contrast(1.07) sepia(0.18);
      opacity: 0.92;
      pointer-events: none;
    }
    .curtain-hint em { font-style: italic; }
  </style>
</head>
<body>
  <div id="curtain">
    <canvas id="curtain-canvas"></canvas>
    <img id="curtain-img" src="curtain.jpg" alt="party curtain">
    <div class="curtain-hint">drag to <em>dress up a metaphor with an almond blossom</em></div>
  </div>

  <script>
    // Only show the curtain on a first, forward visit within this session.
    const navEntry = performance.getEntriesByType('navigation')[0];
    const isBackNav = navEntry && (navEntry.type === 'back_forward');
    const isInternalNav = sessionStorage.getItem('curtainSeen') && navEntry && navEntry.type === 'navigate';
    window.__skipCurtain = !!(isBackNav || isInternalNav);
    if (window.__skipCurtain) {
      document.getElementById('curtain').style.display = 'none';
    }
  </script>

  <script type="importmap">
    { "imports": { "three": "./three.module.min.js" } }
  </script>

  <script type="module">
    const container = document.getElementById('curtain');
    const hint = container.querySelector('.curtain-hint');

    function markSeen() { try { sessionStorage.setItem('curtainSeen', '1'); } catch (e) {} }

    let animId = null;
    let revealed = false;

    // Once the curtain has been drawn far enough aside, fade it out and hand
    // the page over.
    function revealCurtain() {
      if (revealed) return;
      revealed = true;
      markSeen();
      if (hint) hint.style.opacity = '0';
      container.style.transition = 'opacity 0.7s ease';
      container.style.opacity = '0';
      container.style.pointerEvents = 'none';
      setTimeout(() => {
        container.style.display = 'none';
        if (animId) cancelAnimationFrame(animId);
      }, 720);
    }

    // If the simulation can't run, fall back to the plain image; a click reveals.
    function fallback() {
      container.classList.add('fallback');
      container.addEventListener('click', revealCurtain);
    }

    // Boot the simulation only on a first, forward visit; fall back to the
    // still image if three.js or WebGL is unavailable.
    (async () => {
      if (window.__skipCurtain) return;

      let THREE;
      try {
        THREE = await import('three');
      } catch (e) {
        fallback();
        return;
      }

      const canvas = document.getElementById('curtain-canvas');

    let renderer;
    try {
      renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    } catch (e) {
      fallback();
      throw e;
    }
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    const scene = new THREE.Scene();
    scene.add(new THREE.AmbientLight(0xffffff, 1.15));
    const key = new THREE.DirectionalLight(0xffffff, 0.95);
    key.position.set(0.4, 0.7, 1.0);
    scene.add(key);
    const rim = new THREE.DirectionalLight(0xffd0e8, 0.5);
    rim.position.set(-0.6, 0.2, 0.8);
    scene.add(rim);

    let camera;

    // ---- Texture ----
    // Sample only the dense, white-free band of the foil photo (skip the rail at
    // the top, the white side margins, and the frayed white tips at the bottom)
    // and stretch it across the whole cloth so it stays hot pink edge to edge.
    const texture = new THREE.TextureLoader().load('curtain.jpg');
    texture.colorSpace = THREE.SRGBColorSpace;
    texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
    texture.wrapS = THREE.ClampToEdgeWrapping;
    texture.wrapT = THREE.ClampToEdgeWrapping;
    texture.offset.set(0.07, 0.24);
    texture.repeat.set(0.86, 0.52);

    const material = new THREE.MeshPhongMaterial({
      map: texture,
      side: THREE.DoubleSide,
      specular: 0xff7bc0,
      shininess: 16,
    });

    // ---- Cloth state ----
    const GRAVITY = 9.5;
    const DAMP = 0.028;
    const ITER = 4;
    const WIND = 2.1;
    const DT = 1 / 60, DT2 = DT * DT;

    let viewH, viewW, clothW, clothH, topY, xSegs, ySegs;
    let particles = [], constraints = [], geometry, mesh;

    // Curtain-draw state: `open` (0 -> 1) is how far the rail has been pulled
    // aside; `dragDir` +1 gathers the fabric to the right (revealing from the
    // left), -1 gathers to the left. `settleTween` eases `open` after release.
    let open = 0, dragDir = 0, dragging = false, settleTween = null;
    let firstFrame = true;

    // Pointer as a soft collision sphere that pushes the fabric.
    const pointer = new THREE.Vector3(1e5, 1e5, 1e5);
    const SPHERE_R = 0.34;
    const raycaster = new THREE.Raycaster();
    const ndc = new THREE.Vector2();
    const dragPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
    const hitPt = new THREE.Vector3();

    const _diff = new THREE.Vector3();
    const _v = new THREE.Vector3();
    const _tmp = new THREE.Vector3();

    function Particle(x, y, z, pinned) {
      this.pos = new THREE.Vector3(x, y, z);
      this.prev = new THREE.Vector3(x, y, z);
      this.pinTo = new THREE.Vector3(x, y, z);
      this.pinned = pinned;
    }

    function build() {
      const aspect = window.innerWidth / window.innerHeight;
      viewH = 2.0;
      viewW = viewH * aspect;

      // Cloth overhangs the frame generously so its edges stay off-screen even
      // when swung by a hard drag; the top rail is pinned above the view so it
      // hides like a real curtain rail.
      clothW = viewW + 1.4;
      clothH = viewH + 1.5;
      topY = viewH / 2 + 0.35;

      ySegs = 28;
      xSegs = Math.max(20, Math.min(72, Math.round((clothW / clothH) * ySegs)));

      if (geometry) geometry.dispose();
      if (mesh) scene.remove(mesh);

      geometry = new THREE.PlaneGeometry(clothW, clothH, xSegs, ySegs);
      geometry.translate(0, topY - clothH / 2, 0); // hang from topY downward

      particles = [];
      const pos = geometry.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const iy = Math.floor(i / (xSegs + 1));
        const ix = i % (xSegs + 1);
        const p = new Particle(pos.getX(i), pos.getY(i), 0, iy === 0);
        p.u = ix / xSegs; // 0 = left edge, 1 = right edge (used to draw the rail aside)
        particles.push(p);
      }

      // Structural constraints between grid neighbours.
      constraints = [];
      const idx = (x, y) => y * (xSegs + 1) + x;
      const link = (a, b) => {
        const p1 = particles[a], p2 = particles[b];
        constraints.push({ p1, p2, rest: p1.pos.distanceTo(p2.pos) });
      };
      for (let y = 0; y <= ySegs; y++) {
        for (let x = 0; x <= xSegs; x++) {
          if (x < xSegs) link(idx(x, y), idx(x + 1, y));
          if (y < ySegs) link(idx(x, y), idx(x, y + 1));
        }
      }

      mesh = new THREE.Mesh(geometry, material);
      mesh.frustumCulled = false;
      scene.add(mesh);

      // Orthographic camera framed a touch inside the cloth's overhang.
      camera = new THREE.OrthographicCamera(-viewW / 2, viewW / 2, viewH / 2, -viewH / 2, 0.1, 100);
      camera.position.set(0, 0, 6);
      camera.lookAt(0, 0, 0);

      resizeRenderer();
    }

    function resizeRenderer() {
      renderer.setSize(window.innerWidth, window.innerHeight, false);
    }

    function wind(p, t, out) {
      const x = p.pos.x, y = p.pos.y;
      // Keep the lively motion mostly in z (billow toward/away from the viewer);
      // damp the x/y drift so the sheet's edges never wander into the frame.
      out.set(
        Math.sin(x * 2.0 + t * 1.3) * Math.cos(y * 1.6 + t * 0.6) * WIND * 0.45,
        Math.sin(y * 1.1 + t * 0.9) * WIND * 0.15,
        (Math.cos(x * 1.7 - t * 1.1) + 0.4 * Math.sin(y * 2.3 + t * 1.7)) * WIND
      );
      return out;
    }

    // Where a rail particle at rest-position u should sit for the current draw.
    function drawnU(u) {
      return dragDir >= 0 ? u * (1 - open) + open : u * (1 - open);
    }

    function step(now) {
      const t = now / 1000;

      for (const p of particles) {
        if (p.pinned) continue;
        wind(p, t, _tmp);
        _tmp.y -= GRAVITY;
        // Verlet integration
        _v.subVectors(p.pos, p.prev).multiplyScalar(1 - DAMP);
        p.prev.copy(p.pos);
        p.pos.add(_v).addScaledVector(_tmp, DT2);
      }

      for (let k = 0; k < ITER; k++) {
        for (const c of constraints) {
          const p1 = c.p1, p2 = c.p2;
          _diff.subVectors(p2.pos, p1.pos);
          const d = _diff.length();
          if (d === 0) continue;
          _diff.multiplyScalar((d - c.rest) / d);
          if (p1.pinned && p2.pinned) continue;
          else if (p1.pinned) p2.pos.sub(_diff);
          else if (p2.pinned) p1.pos.add(_diff);
          else { p1.pos.addScaledVector(_diff, 0.5); p2.pos.addScaledVector(_diff, -0.5); }
        }
        // Push fabric out of the pointer sphere.
        if (pointer.x < 1e4) {
          for (const p of particles) {
            if (p.pinned) continue;
            _v.subVectors(p.pos, pointer);
            const l = _v.length();
            if (l < SPHERE_R && l > 0) p.pos.copy(pointer).addScaledVector(_v.divideScalar(l), SPHERE_R);
          }
        }
      }

      // Anchor the top rail, sliding it toward one side as the curtain is drawn.
      for (const p of particles) {
        if (!p.pinned) continue;
        p.pinTo.x = -clothW / 2 + drawnU(p.u) * clothW;
        p.pos.copy(p.pinTo);
      }
    }

    function updateGeometry() {
      const arr = geometry.attributes.position.array;
      for (let i = 0; i < particles.length; i++) {
        const p = particles[i].pos;
        arr[i * 3] = p.x; arr[i * 3 + 1] = p.y; arr[i * 3 + 2] = p.z;
      }
      geometry.attributes.position.needsUpdate = true;
      geometry.computeVertexNormals();
    }

    function frame(now) {
      animId = requestAnimationFrame(frame);
      if (settleTween) {
        const s = (now - settleTween.start) / settleTween.dur;
        if (s >= 1) {
          open = settleTween.to;
          const cb = settleTween.cb, toZero = settleTween.to === 0;
          settleTween = null;
          if (toZero) dragDir = 0;
          if (cb) cb();
        } else {
          const e = s < 0.5 ? 2 * s * s : 1 - Math.pow(-2 * s + 2, 2) / 2; // easeInOutQuad
          open = settleTween.from + (settleTween.to - settleTween.from) * e;
        }
      }
      if (hint) hint.style.opacity = String(Math.max(0, 0.92 - open * 1.6));
      step(now);
      updateGeometry();
      renderer.render(scene, camera);
      // The pink fill covers any boot flash; once the cloth is actually drawn,
      // drop it to transparent so drawing the curtain aside reveals the page.
      if (firstFrame) { firstFrame = false; container.style.backgroundColor = 'transparent'; }
    }

    // ---- Pointer interaction ----
    function toWorld(ev) {
      ndc.x = (ev.clientX / window.innerWidth) * 2 - 1;
      ndc.y = -(ev.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(ndc, camera);
      if (raycaster.ray.intersectPlane(dragPlane, hitPt)) {
        pointer.copy(hitPt);
        pointer.z = -0.12; // sit just behind the cloth so it billows toward the viewer
      }
    }
    function retract() { pointer.set(1e5, 1e5, 1e5); }

    const OPEN_DRAG_FRAC = 0.5; // dragging half the viewport width draws it fully aside
    let dragStartX = 0;

    container.addEventListener('pointerdown', (ev) => {
      if (revealed) return;
      dragging = true;
      dragStartX = ev.clientX;
      settleTween = null;
      retract();
      if (container.setPointerCapture) { try { container.setPointerCapture(ev.pointerId); } catch (e) {} }
    });
    window.addEventListener('pointermove', (ev) => {
      if (dragging) {
        const dx = ev.clientX - dragStartX;
        if (dragDir === 0 && Math.abs(dx) > 5) dragDir = dx > 0 ? 1 : -1;
        if (dragDir !== 0) open = Math.min(1, Math.max(0, Math.abs(dx) / (window.innerWidth * OPEN_DRAG_FRAC)));
      } else if (ev.pointerType === 'mouse' && !revealed) {
        toWorld(ev); // gentle hover ripple for liveliness
      }
    });
    function endDrag() {
      if (!dragging) return;
      dragging = false;
      retract();
      // Past halfway, glide the rest of the way open and reveal; else spring shut.
      settleTween = open >= 0.5
        ? { from: open, to: 1, start: performance.now(), dur: 420, cb: revealCurtain }
        : { from: open, to: 0, start: performance.now(), dur: 520, cb: null };
    }
    window.addEventListener('pointerup', endDrag);
    window.addEventListener('pointercancel', endDrag);
    container.addEventListener('pointerleave', retract);
    container.addEventListener('contextmenu', (e) => e.preventDefault());

    let resizeTimer = null;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        if (!revealed && !dragging && !settleTween && open === 0) {
          build();
        } else {
          const aspect = window.innerWidth / window.innerHeight;
          viewW = viewH * aspect;
          camera.left = -viewW / 2; camera.right = viewW / 2;
          camera.top = viewH / 2; camera.bottom = -viewH / 2;
          camera.updateProjectionMatrix();
          resizeRenderer();
        }
      }, 180);
    });

    build();
    frame(performance.now());
    })();
  </script>

  <main class="page">
    <h1 style="font-size: 1.4em;">Translator's Foreword</h1>
    <p>
      <a href="jac.html" class="pencil-underline">She</a> <a href="serious.html" class="pencil-underline">sighs</a> along with objects that aspire to resemble <a href="works.html" class="pencil-underline">something</a> else.<sup>1</sup>
    </p>
    <div class="footnote">
      <sup>1</sup> write to her: jacquelinelan1642@gmail.com<br>
      see her: @pistachio.cache
    </div>
  </main>
  <div class="vignette"></div>
</body>
</html>
