<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Screenshot Photography</title>
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 20px; /* Added gentle padding for edges */
      background-color: #ffffff;
      font-family: 'IM Fell English', serif;
      color: #222;
      line-height: 1.6; /* For any future text */
    }
    .back-link {
      text-align: left; /* Aligns naturally */
      margin-bottom: 2em; /* Space before grid */
      font-size: 0.9em;
    }
    .back-link a {
      text-decoration: none;
      color: #000;
    }
    .back-link a:hover {
      text-decoration: underline; /* Simple hover, no fancy underline.png needed unless you add it back */
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); /* 3-4 cols on desktop, stacks on mobile */
      gap: 1.5em; /* Breathing room between images */
      max-width: 1200px; /* Keeps it centered/not too wide */
      margin: 0 auto;
    }
    .gallery-item {
      /* No rotation—keeps it straight for gallery feel */
    }
    .gallery-item img {
      display: block;
      width: 100%; /* Fills the grid cell */
      height: auto;
      border: 1px solid #ccc;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      /* Optional: Add subtle tilt if you want poet-page flair */
      /* transform: rotate(-0.3deg); */
    }
       a:hover::before {
      content: '';
      position: absolute;
      left: -2px;
      right: -2px;
      top: 45%;
      transform: translateY(-50%) rotate(-2deg) skewX(-2deg);
      height: 1.4em;
      background: rgba(150, 250, 140, 0.75);
      z-index: -1;
      border-radius: 6px;
      mix-blend-mode: multiply;
    }
    .pencil-underline::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 8px;
      background-image: url('underline_extracted.png');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center bottom;
      opacity: 0.85;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <a href="index.html" class="pencil-underline" style="position: absolute; top: 1em; left: 1.5em; text-decoration: none; font-size: 0.9em; color: #000;">go back</a><br><br><br>
